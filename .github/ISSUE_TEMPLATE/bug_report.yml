name: Issue Report
description: Report BrookFirewall issue...
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the form below to report an issue with BrookFirewall.

        **File size limit:** Each attachment must be 10 MB or smaller.

        **Offline tool:** [Brook Media Compressor](https://github.com/Brook-Design-LLC/BrookMediaCompressor) — compress media before uploading.
  - type: input
    id: os
    attributes:
      label: OS
      description: iOS version (e.g., iOS 18.0)
      placeholder: e.g., iOS 18.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Device model
      placeholder: e.g., iPhone 15 Pro
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Network type used when the issue occurred
      options:
        - WiFi
        - Cellular
        - WiFi + Cellular
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version
      description: BrookFirewall app version
      placeholder: e.g., 1.2.3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened
      placeholder: What were you doing when the issue occurred?
    validations:
      required: true
  - type: upload
    id: attachments
    attributes:
      label: Attachments
      description: |
        Optional screenshots, videos, or log files. Each file must be 10 MB or smaller.
        Upload a `.bkglog` file for automated analysis, or use Brook Media Compressor for large media.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.log,.txt,.bkglog"
