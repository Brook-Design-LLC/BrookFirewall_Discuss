name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and upload your `.txt` or `.log` file below. The automated bot will download the log, run analysis, and format this issue. You may also attach screenshots or videos in the same upload field.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: upload
    id: log_file
    attributes:
      label: Log File Attachment
      description: |
        Upload exactly one `.txt` or `.log` file (required for analysis).
        You may also attach screenshots or videos in this same field.
    validations:
      required: true
      accept: ".log,.txt,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
