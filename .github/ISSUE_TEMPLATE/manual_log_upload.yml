name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Log Analysis]: "
labels: ["manual-log-upload"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and paste your log contents below. The automated bot will analyze the log and format this issue.

        **Important:** Open your `.txt` or `.log` file and paste the full contents into the field below. File uploads cannot be processed automatically by GitHub Actions.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: textarea
    id: log_file
    attributes:
      label: Log File Attachment
      description: Paste the full contents of your `.txt` or `.log` file here.
      placeholder: |
        OS: iOS 18.0
        Device: iPhone 15 Pro
        Network: WiFi
        App Version: 1.0.0

        Paste the rest of your log below...
    validations:
      required: true
