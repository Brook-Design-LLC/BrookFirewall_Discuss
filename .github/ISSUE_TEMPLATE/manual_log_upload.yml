name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Log Analysis]: "
labels: ["manual-log-upload"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and upload your `.txt` or `.log` file below. The automated bot will download the log, run analysis, and format this issue. You may also attach optional screenshots or videos for context.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: upload
    id: log_file
    attributes:
      label: Log File Attachment
      description: Upload exactly one `.txt` or `.log` file. Only this file will be analyzed.
    validations:
      required: true
      accept: ".log,.txt"
  - type: upload
    id: media_attachments
    attributes:
      label: Screenshots / Videos
      description: Optional images or videos for context. These are not analyzed by the bot.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
