name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and upload your `.txt` or `.log` file below. The automated bot will download the log, run analysis, and format this issue. You may also attach screenshots or videos in the same upload field.

        **File size limit:** Each file must be 10 MB or smaller (including `.log` and `.txt` files).

        **Offline browser tools (10 MB per file limit):**
        - [Compress media](https://brook-design-llc.github.io/BrookFirewall_Discuss/media-compress.html) — `https://brook-design-llc.github.io/BrookFirewall_Discuss/media-compress.html`
        - [Split large logs](https://brook-design-llc.github.io/BrookFirewall_Discuss/log-split.html) — `https://brook-design-llc.github.io/BrookFirewall_Discuss/log-split.html`
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: upload
    id: log_file
    attributes:
      label: Log File Attachment
      description: |
        Upload exactly one `.txt` or `.log` file (required for analysis), or a split part series (`*.txt.part1`, `*.txt.part2`, …).
        You may also attach screenshots or videos in this same field.
        Each file must be 10 MB or smaller (including log files).
        If a file exceeds 10 MB, use the offline tools linked above before uploading.
    validations:
      required: true
      accept: ".log,.txt,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
