name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and upload your log file below. The automated bot will download the log, run analysis, and format this issue. You may also attach screenshots or videos in the same upload field.

        **File size limit:** Each file must be 10 MB or smaller.

        **Offline tool:** [Brook Media Compressor](https://github.com/Brook-Design-LLC/BrookMediaCompressor) — compress media before uploading.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: upload
    id: log_file
    attributes:
      label: Log File Attachment
      description: |
        Upload a `.bkglog` diagnostic export (app/API), a `.zip` containing a `.bkglog` file, or a single `.txt`/`.log` file for analysis.
        You may also attach screenshots or videos in this same field.
        Each file must be 10 MB or smaller.
    validations:
      required: true
      accept: ".zip,.log,.txt,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
