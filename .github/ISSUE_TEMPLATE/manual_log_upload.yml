name: Manual Log Upload
description: Upload a raw log file for automated analysis and formatting.
title: "[Log Analysis]: "
labels: ["manual-log-upload"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide an issue description and upload your `.txt` or `.log` file below. The automated bot will download the log, run analysis, and format this issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened or what went wrong.
      placeholder: e.g., Connection dropped after 10 minutes...
    validations:
      required: true
  - type: upload
    id: log_file
    attributes:
      label: Log File Attachment
      description: Drag and drop your `.txt` or `.log` file here.
    validations:
      required: true
      accept: ".log,.txt"
