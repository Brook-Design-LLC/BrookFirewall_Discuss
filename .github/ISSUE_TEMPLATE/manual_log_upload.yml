name: Manual Log Upload
description: Upload raw connection and system logs for automated analysis.
title: "[Log Analysis]: "
labels: ["manual-log-upload"]
body:
  - type: markdown
    attributes:
      value: |
        Paste your unformatted raw logs below. The automated bot will analyze the trace and generate the report table.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide context or what went wrong.
      placeholder: e.g., Connection stalls after switching networks...
    validations:
      required: true
  - type: dropdown
    id: vpn_status
    attributes:
      label: VPN Status
      description: Select the VPN state when the issue occurred.
      options:
        - Connected
        - Disconnected
        - Connecting
        - Reasserting
        - Unknown
    validations:
      required: true
  - type: textarea
    id: log_content
    attributes:
      label: Log Content
      description: Paste the complete raw log output here.
      render: shell
    validations:
      required: true
