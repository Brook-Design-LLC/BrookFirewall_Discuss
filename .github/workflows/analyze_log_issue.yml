name: Format Manual Log Issue

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  analyze-and-format:
    if: |
      !contains(github.event.issue.body, '## Info') &&
      (contains(github.event.issue.body, '.zip') ||
       contains(github.event.issue.body, '.bkglog') ||
       contains(github.event.issue.body, '### Log File Attachment'))
    runs-on: ubuntu-latest
    steps:
      # sudosubin/gh-attach resolves user-attachments 302 → S3 presigned URL downloads
      - name: Install gh-attach extension
        run: gh extension install sudosubin/gh-attach

      - name: Download log and format issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GH_REPO="${REPOSITORY}"

          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .body > issue_body.md

          URL_RESULT="$(python3 - << 'PY'
          import pathlib
          import re

          body = pathlib.Path("issue_body.md").read_text(encoding="utf-8")

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          patterns = [
              r"https://github\.com/user-attachments/assets/[a-f0-9\-]+",
              r"https://github\.com/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^/\s\)\>]+/[^/\s\)\>]+/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^\s\)\>]+/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://(?:private-)?user-images\.githubusercontent\.com/[^\s\)\>]+",
          ]

          def find_all_attachment_urls(text: str) -> list[str]:
              urls: list[str] = []
              seen: set[str] = set()
              for pattern in patterns:
                  for match in re.finditer(pattern, text):
                      url = match.group(0)
                      if url not in seen:
                          seen.add(url)
                          urls.append(url)
              for match in re.finditer(r"\]\((https?://[^\)]+)\)", text):
                  url = match.group(1)
                  if url not in seen:
                      seen.add(url)
                      urls.append(url)
              return urls

          def is_diagnostic_archive_url(url: str) -> bool:
              return bool(re.search(r"\.(zip|bkglog)(\?|$)", url, re.I))

          def is_log_url(url: str) -> bool:
              return bool(re.search(r"\.(log|txt)(\?|$)", url, re.I))

          all_urls = find_all_attachment_urls(body)
          bkglog_urls = [u for u in all_urls if is_diagnostic_archive_url(u)]

          if bkglog_urls:
              if len(bkglog_urls) > 1:
                  print("MULTIPLE_BKGLOG")
              else:
                  print(f"BKGLOG:{bkglog_urls[0]}")
          else:
              log_field = extract_field("Log File Attachment", body)
              log_urls = [u for u in find_all_attachment_urls(log_field) if is_log_url(u)]
              if len(log_urls) > 1:
                  print("MULTIPLE_LOG")
              elif len(log_urls) == 1:
                  print(f"OK:{log_urls[0]}")
              else:
                  print("NONE")
          PY
          )"

          write_warning_issue() {
            local detail="$1"
            DETAIL="$detail" python3 - << 'EOF'
          import os
          import re
          import subprocess

          issue_number = os.environ["ISSUE_NUMBER"]
          repository = os.environ["REPOSITORY"]
          detail = os.environ["DETAIL"]
          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          desc = extract_field("Description", issue_body)
          error_body = f"{desc}\n\n> [!WARNING]\n{detail}"
          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(error_body)
          subprocess.run(
              ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", "issue_formatted.md"],
              check=True,
          )
          EOF
          }

          if [[ "$URL_RESULT" == "MULTIPLE_BKGLOG" ]]; then
            write_warning_issue "> **Multiple diagnostic archives detected.** Upload only one `.zip` or `.bkglog` file per issue."
            exit 0
          fi

          if [[ "$URL_RESULT" == "MULTIPLE_LOG" ]]; then
            write_warning_issue "> **Multiple log files detected.** Upload one diagnostic `.zip` or a single `.txt`/`.log` file."
            exit 0
          fi

          if [[ "$URL_RESULT" == "NONE" ]]; then
            write_warning_issue "> **No log file attachment detected.** Please edit this issue and upload a diagnostic `.zip` (containing `.bkglog`), `.bkglog`, `.txt`, or `.log` file."
            exit 0
          fi

          if [ -z "${GH_PAT:-}" ]; then
            write_warning_issue "> **Log download is not configured.** Add \`GH_PAT\` (Classic PAT with \`repo\` scope) as a repository Actions secret before uploaded logs can be analyzed."
            exit 0
          fi

          if [[ "$URL_RESULT" == BKGLOG:* ]]; then
            DOWNLOAD_URL="${URL_RESULT#BKGLOG:}"

            download_ok=false
            download_error=""
            for delay in 0 10 20 30; do
              if [ "$delay" -gt 0 ]; then
                sleep "$delay"
              fi
              if GH_TOKEN="$GH_PAT" gh attach download "$DOWNLOAD_URL" -O issue.archive 2>download.err; then
                download_ok=true
                download_error=""
                break
              fi
              download_error="$(cat download.err)"
            done

            if [ "$download_ok" != true ] || [ ! -s issue.archive ]; then
              DOWNLOAD_URL="$DOWNLOAD_URL" DOWNLOAD_ERROR="$download_error" python3 - << 'EOF'
          import os
          import re
          import subprocess

          issue_number = os.environ["ISSUE_NUMBER"]
          repository = os.environ["REPOSITORY"]
          download_url = os.environ["DOWNLOAD_URL"]
          download_error = os.environ.get("DOWNLOAD_ERROR", "unknown error")
          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          desc = extract_field("Description", issue_body)
          error_body = (
              f"{desc}\n\n"
              f"> [!WARNING]\n"
              f"> **Failed to download diagnostic archive.** URL: `{download_url}`\n"
              f"> Error: {download_error}\n"
              f"> Ensure `GH_PAT` is a Classic PAT with `repo` scope and SSO authorization, then edit this issue to retry."
          )
          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(error_body)
          subprocess.run(
              ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", "issue_formatted.md"],
              check=True,
          )
          EOF
              exit 0
            fi

            if ! DOWNLOAD_URL="$DOWNLOAD_URL" python3 - << 'PY'
          import os
          import re
          import sys
          import tarfile
          import tempfile
          import zipfile

          archive_path = "issue.archive"
          download_url = os.environ.get("DOWNLOAD_URL", "")
          required_files = ("analyze.txt", "config.json", "log.txt")

          def basename(path: str) -> str:
              return path.rsplit("/", 1)[-1]

          def list_tar_members(path: str) -> list[str]:
              for mode in ("r:*", "r:gz", "r:bz2", "r:xz", "r:"):
                  try:
                      with tarfile.open(path, mode) as tar:
                          return [m.name for m in tar.getmembers() if m.isfile()]
                  except (tarfile.TarError, OSError):
                      continue
              return []

          def read_tar_member(path: str, filename: str) -> bytes | None:
              for mode in ("r:*", "r:gz", "r:bz2", "r:xz", "r:"):
                  try:
                      with tarfile.open(path, mode) as tar:
                          for member in tar.getmembers():
                              if member.isfile() and basename(member.name) == filename:
                                  extracted = tar.extractfile(member)
                                  if extracted:
                                      return extracted.read()
                  except (tarfile.TarError, OSError):
                      continue
              return None

          def extract_bkglog_files(bkglog_path: str) -> dict[str, str]:
              members = list_tar_members(bkglog_path)
              files: dict[str, str] = {}
              for filename in required_files:
                  data = read_tar_member(bkglog_path, filename)
                  if data is None:
                      raise ValueError(
                          f"missing {filename} in .bkglog; found: {', '.join(members) or 'none'}"
                      )
                  files[filename] = data.decode("utf-8", errors="replace")
              return files

          def is_real_zip_entry(name: str) -> bool:
              parts = name.replace("\\", "/").split("/")
              if any(part == "__MACOSX" for part in parts):
                  return False
              leaf = parts[-1]
              if leaf.startswith("._") or leaf == ".DS_Store":
                  return False
              return True

          def extract_bkglog_from_zip(zip_path: str) -> dict[str, str]:
              with zipfile.ZipFile(zip_path) as zf:
                  matches = [
                      name for name in zf.namelist()
                      if is_real_zip_entry(name)
                      and basename(name).lower().endswith(".bkglog")
                  ]
                  if not matches:
                      raise ValueError(
                          f"no .bkglog in zip; found: {', '.join(zf.namelist()) or 'none'}"
                      )
                  if len(matches) > 1:
                      raise ValueError(f"multiple .bkglog files in zip: {', '.join(matches)}")
                  bkglog_bytes = zf.read(matches[0])

              with tempfile.NamedTemporaryFile(delete=False, suffix=".bkglog") as tmp:
                  tmp.write(bkglog_bytes)
                  bkglog_path = tmp.name
              try:
                  return extract_bkglog_files(bkglog_path)
              finally:
                  os.unlink(bkglog_path)

          def extract_diagnostic_bundle(path: str, url: str) -> dict[str, str]:
              if re.search(r"\.zip(\?|$)", url, re.I):
                  return extract_bkglog_from_zip(path)
              if re.search(r"\.bkglog(\?|$)", url, re.I):
                  return extract_bkglog_files(path)
              try:
                  return extract_bkglog_from_zip(path)
              except (ValueError, zipfile.BadZipFile, OSError):
                  return extract_bkglog_files(path)

          try:
              bundle = extract_diagnostic_bundle(archive_path, download_url)
          except (ValueError, zipfile.BadZipFile, tarfile.TarError, OSError) as exc:
              with open("extract.err", "w", encoding="utf-8") as err:
                  err.write(str(exc))
              sys.exit(1)

          for filename, key in (
              ("analyze.txt", "analyze"),
              ("config.json", "config"),
              ("log.txt", "log"),
          ):
              content = bundle[filename].strip()
              if not content:
                  with open("extract.err", "w", encoding="utf-8") as err:
                      err.write(f"{filename} is empty in diagnostic archive")
                  sys.exit(1)
              with open(filename, "w", encoding="utf-8") as out:
                  out.write(bundle[filename])
          PY
            then
              if [ -f extract.err ]; then
              EXTRACT_ERROR="$(cat extract.err)"
                write_warning_issue "> **Failed to extract diagnostic archive.** ${EXTRACT_ERROR}"
              else
                write_warning_issue "> **Failed to extract diagnostic archive.** Ensure the file is a valid BrookFirewall export."
              fi
              exit 0
            fi

            if [ ! -s analyze.txt ] || [ ! -s config.json ] || [ ! -s log.txt ]; then
              write_warning_issue "> **Diagnostic archive is missing analyze.txt, config.json, or log.txt.** Ensure the file was exported from BrookFirewall."
              exit 0
            fi

            DOWNLOAD_URL="$DOWNLOAD_URL" python3 - << 'EOF'
          import json
          import os
          import re
          import subprocess

          issue_number = os.environ.get("ISSUE_NUMBER", "")
          repository = os.environ.get("REPOSITORY", "")
          download_url = os.environ.get("DOWNLOAD_URL", "")
          max_chars = 60000
          log_lines = 100

          def gh_issue_edit(body_file: str, title: str | None = None) -> None:
              cmd = ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", body_file]
              if title:
                  cmd.extend(["--title", title])
              subprocess.run(cmd, check=True)

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          patterns = [
              r"https://github\.com/user-attachments/assets/[a-f0-9\-]+",
              r"https://github\.com/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^/\s\)\>]+/[^/\s\)\>]+/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^\s\)\>]+/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://(?:private-)?user-images\.githubusercontent\.com/[^\s\)\>]+",
          ]

          def find_all_attachment_urls(text: str) -> list[str]:
              urls: list[str] = []
              seen: set[str] = set()
              for pattern in patterns:
                  for match in re.finditer(pattern, text):
                      url = match.group(0)
                      if url not in seen:
                          seen.add(url)
                          urls.append(url)
              for match in re.finditer(r"\]\((https?://[^\)]+)\)", text):
                  url = match.group(1)
                  if url not in seen:
                      seen.add(url)
                      urls.append(url)
              return urls

          def is_diagnostic_archive_url(url: str) -> bool:
              return bool(re.search(r"\.(zip|bkglog)(\?|$)", url, re.I))

          def is_log_url(url: str) -> bool:
              return bool(re.search(r"\.(log|txt)(\?|$)", url, re.I))

          def format_config_json(config_text: str) -> str:
              try:
                  return json.dumps(json.loads(config_text), indent=2, ensure_ascii=False)
              except json.JSONDecodeError:
                  return config_text

          def truncate_config(config_text: str) -> tuple[str, bool]:
              if len(config_text) <= max_chars:
                  return config_text, False
              return config_text[:max_chars], True

          def truncate_log(log_text: str) -> tuple[str, bool]:
              lines = log_text.splitlines()
              truncated = len(lines) > log_lines
              tail = lines[-log_lines:]
              text = "\n".join(tail)
              if len(text) > max_chars:
                  text = text[-max_chars:]
                  truncated = True
              return text, truncated

          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()
          with open("analyze.txt", encoding="utf-8", errors="replace") as f:
              analyze_md = f.read().strip()
          with open("config.json", encoding="utf-8", errors="replace") as f:
              config_text = f.read().strip()
          with open("log.txt", encoding="utf-8", errors="replace") as f:
              log_text = f.read().strip()

          desc = extract_field("Description", issue_body)
          attachment_fields = [
              extract_field("Log File Attachment", issue_body),
              extract_field("Attachments", issue_body),
              extract_field("Screenshots / Videos", issue_body),
          ]
          excluded_urls = {download_url}
          excluded_urls.update(
              u for u in find_all_attachment_urls(issue_body)
              if is_diagnostic_archive_url(u) or is_log_url(u)
          )

          media_lines = []
          for field in attachment_fields:
              for line in field.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if any(url in stripped for url in excluded_urls):
                      continue
                  if stripped in excluded_urls:
                      continue
                  media_lines.append(line)
          media = "\n".join(media_lines).strip()

          config_body, config_truncated = truncate_config(format_config_json(config_text))
          log_body, log_truncated = truncate_log(log_text)
          config_note = "> Config truncated to 60000 chars.\n\n" if config_truncated else ""
          log_note = "> Log truncated to last 100 lines / 60000 chars.\n\n" if log_truncated else ""

          body_parts = [analyze_md]
          if desc and "## Description" not in analyze_md:
              body_parts.append(f"## Description\n\n{desc}")
          if media and "## Screenshots / Videos" not in analyze_md:
              body_parts.append(f"## Screenshots / Videos\n\n{media}")
          body_parts.append(
              "<details>\n"
              "<summary>Config</summary>\n\n"
              f"{config_note}"
              f"```json\n{config_body}\n```\n"
              "</details>"
          )
          body_parts.append(
              "<details>\n"
              "<summary>Log (last 100 lines)</summary>\n\n"
              f"{log_note}"
              f"```\n{log_body}\n```\n"
              "</details>"
          )
          body_parts.append(f"---\n**Attached Log File:** [Download Log File]({download_url})")

          formatted_body = "\n\n".join(body_parts)

          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(formatted_body)

          title_result = subprocess.run(
              ["gh", "api", f"repos/{repository}/issues/{issue_number}", "--jq", ".title"],
              capture_output=True,
              text=True,
              check=True,
          )
          current_title = title_result.stdout.strip()
          if current_title.startswith("[Report]"):
              new_title = current_title
          else:
              new_title = re.sub(r"^\[Log Analysis\]:?\s*", "[Report] ", current_title)

          gh_issue_edit("issue_formatted.md", title=new_title)
          EOF
            exit 0
          fi

          DOWNLOAD_URL="${URL_RESULT#OK:}"

          download_ok=false
          download_error=""
          for delay in 0 10 20 30; do
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            if GH_TOKEN="$GH_PAT" gh attach download "$DOWNLOAD_URL" -O issue_log.txt 2>download.err; then
              download_ok=true
              download_error=""
              break
            fi
            download_error="$(cat download.err)"
          done

          if [ "$download_ok" != true ] || [ ! -s issue_log.txt ]; then
            DOWNLOAD_URL="$DOWNLOAD_URL" DOWNLOAD_ERROR="$download_error" python3 - << 'EOF'
          import os
          import re
          import subprocess

          issue_number = os.environ["ISSUE_NUMBER"]
          repository = os.environ["REPOSITORY"]
          download_url = os.environ["DOWNLOAD_URL"]
          download_error = os.environ.get("DOWNLOAD_ERROR", "unknown error")
          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          desc = extract_field("Description", issue_body)
          error_body = (
              f"{desc}\n\n"
              f"> [!WARNING]\n"
              f"> **Failed to download log file.** URL: `{download_url}`\n"
              f"> Error: {download_error}\n"
              f"> Ensure `GH_PAT` is a Classic PAT with `repo` scope and SSO authorization, then edit this issue to retry."
          )
          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(error_body)
          subprocess.run(
              ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", "issue_formatted.md"],
              check=True,
          )
          EOF
            exit 0
          fi

          DOWNLOAD_URL="$DOWNLOAD_URL" python3 - << 'EOF'
          import os
          import re
          import subprocess

          issue_number = os.environ.get("ISSUE_NUMBER", "")
          repository = os.environ.get("REPOSITORY", "")
          download_url = os.environ.get("DOWNLOAD_URL", "")
          log_urls = [download_url] if download_url else []

          def gh_issue_edit(body_file: str, title: str | None = None) -> None:
              cmd = ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", body_file]
              if title:
                  cmd.extend(["--title", title])
              subprocess.run(cmd, check=True)

          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()
          with open("issue_log.txt", encoding="utf-8", errors="replace") as f:
              raw_log = f.read()

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          def is_log_url(url: str) -> bool:
              return bool(re.search(r"\.(log|txt)(\?|$)", url, re.I))

          desc = extract_field("Description", issue_body)
          log_field = extract_field("Log File Attachment", issue_body)
          legacy_media = extract_field("Screenshots / Videos", issue_body).strip()
          media_lines = []
          for line in log_field.splitlines():
              stripped = line.strip()
              if not stripped:
                  continue
              if any(url in stripped and is_log_url(url) for url in log_urls):
                  continue
              if stripped in log_urls:
                  continue
              media_lines.append(line)
          media_from_field = "\n".join(media_lines).strip()
          media = legacy_media or media_from_field
          media_section = f"\n\n## Screenshots / Videos\n\n{media}" if media else ""
          lines = raw_log.splitlines()

          def md_cell(val: str) -> str:
              return val.replace("\n", " ").replace("|", "\\|").strip()

          info_dict = {
              "OS": "unknown",
              "Device": "unknown",
              "Network": "unknown",
              "App Ver": "unknown"
          }

          for line in lines[:20]:
              if line.startswith("OS:"):
                  info_dict["OS"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("Device:"):
                  info_dict["Device"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("Network:"):
                  info_dict["Network"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("App Version:"):
                  info_dict["App Ver"] = line.split(":", 1)[1].strip() or "unknown"

          traffic_indicators = (
              "proxy/tun: processing",
              "taking detour",
              "tunneling request",
              "dialing TCP",
              "proxy: Xtls",
              "Logger started",
              "core: Xray"
          )

          last_closing_idx = -1
          for idx, line in enumerate(lines):
              if "app/log: Logger closing" in line:
                  last_closing_idx = idx

          if last_closing_idx == -1:
              vpn_status = "Connected" if any("Logger started" in l or "PacketTunnelTun up" in l for l in lines) else "Unknown"
          else:
              has_traffic_after = any(
                  any(indicator in l for indicator in traffic_indicators)
                  for l in lines[last_closing_idx + 1:]
              )
              vpn_status = "Connected" if has_traffic_after else "Disconnected"

          brook_method = "Inactive / Unknown"
          if "Success, coordinates patched" in raw_log:
              brook_method = "Override (Coordinates Patched)"
          elif "Success, wloc rejected with 403" in raw_log:
              brook_method = "Reject (403 Forbidden)"
          elif re.search(r"taking detour \[block\] for \[tcp:gs-loc", raw_log):
              brook_method = "Traditional (Detour Block)"

          dns_answered_domains = set()
          for line in lines:
              if "app/dns:" in line or "proxy/dns:" in line:
                  m_ans = re.search(r"got answer:\s+([^\s]+)\.\s+Type", line)
                  if m_ans:
                      domain = m_ans.group(1).lower()
                      if "gs-loc" not in domain and "ls.apple" not in domain:
                          dns_answered_domains.add(domain)

          conn_domains = {}
          active_connections = set()

          for line in lines:
              m_sniff = re.search(r"\[(\d+)\] app/dispatcher: sniffed domain:\s+([^\s]+)", line)
              if m_sniff:
                  conn_domains[m_sniff.group(1)] = m_sniff.group(2).lower()

              if "proxy: Xtls Unpadding new block" in line or "CopyRawConn" in line:
                  m_cid = re.search(r"\[(\d+)\]", line)
                  if m_cid:
                      active_connections.add(m_cid.group(1))

          network_ok_target = None
          for cid in active_connections:
              dom = conn_domains.get(cid)
              if dom and dom in dns_answered_domains:
                  network_ok_target = dom
                  break

          if network_ok_target:
              network_ok_text = f"Yes ({network_ok_target} reachable)"
          elif dns_answered_domains and active_connections:
              network_ok_text = "Yes (traffic flow confirmed)"
          else:
              network_ok_text = "No (no external domain confirmed)"

          utun_errors = raw_log.count("falied to set interface") + raw_log.count("failed to set interface")
          utun_text = "OK" if utun_errors == 0 else f"{utun_errors} interface errors"

          detour_counts = {}
          direct_count = 0
          for line in lines:
              m = re.search(r"taking detour \[([^\]]+)\]", line)
              if m:
                  tag = m.group(1)
                  if tag in ("dns-out", "mitm-loop", "tls-repack", "block"):
                      continue
                  if tag == "direct":
                      direct_count += 1
                  else:
                      detour_counts[tag] = detour_counts.get(tag, 0) + 1

          if not detour_counts:
              outbound_text = "Direct"
          else:
              proxy_tag = max(detour_counts, key=detour_counts.get)
              proxy_count = detour_counts[proxy_tag]
              total_routing = direct_count + proxy_count
              if total_routing == 0:
                  outbound_text = f"Proxy ({proxy_tag}); no routing data in log"
              else:
                  direct_ratio = direct_count / total_routing
                  if direct_ratio >= 0.8 and total_routing >= 5:
                      outbound_text = f"Proxy ({proxy_tag}); possible misroute (mostly direct) (direct {direct_count}, proxy {proxy_count})"
                  else:
                      outbound_text = f"Proxy ({proxy_tag}); routing OK (direct {direct_count}, proxy {proxy_count})"

          spoofing_lines = [l for l in lines if "[Brook.Module.Spoofing]" in l]
          if not spoofing_lines:
              brook_status_text = "no WLOC logs"
          else:
              error_count = sum(1 for l in spoofing_lines if "[Error]" in l)
              last_success = None
              for l in spoofing_lines:
                  if "Success, coordinates patched" in l or "Success, wloc rejected with 403" in l:
                      m_ts = re.search(r"^(\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,6})?)", l)
                      if m_ts:
                          last_success = m_ts.group(1)
              parts = ["WLOC logs present"]
              if last_success:
                  parts.append(f"last success {last_success}")
              parts.append(f"{error_count} errors")
              brook_status_text = "; ".join(parts)

          dns_answers = 0
          dns_rtts = []
          dns_not_found = 0
          dns_no_resp = 0

          got_answer_pat = re.compile(r"got answer:\s+([^\s]+)\.\s+Type[^-]+->\s+\[([^\]]*)\],\s+rtt:\s*([\d.]+)ms")
          for line in lines:
              if "app/dns:" not in line and "proxy/dns:" not in line:
                  continue
              m = got_answer_pat.search(line)
              if m:
                  if m.group(2).strip():
                      dns_answers += 1
                      try:
                          dns_rtts.append(float(m.group(3)))
                      except ValueError:
                          pass
                  continue
              if "returning nil for domain" in line:
                  dns_not_found += 1
                  continue
              if "failed to retrieve response for" in line:
                  dns_no_resp += 1
                  continue

          total_dns = dns_answers + dns_not_found + dns_no_resp
          if total_dns == 0:
              dns_text = "No DNS activity in log"
          else:
              avg_ms = round(sum(dns_rtts) / len(dns_rtts)) if dns_rtts else None
              is_slow = (avg_ms is not None) and (avg_ms > 1000)
              if dns_not_found == 0 and dns_no_resp == 0 and not is_slow:
                  dns_text = f"OK ({dns_answers} answers, avg {avg_ms}ms)" if avg_ms is not None else f"OK ({dns_answers} answers)"
              else:
                  issues = []
                  if dns_not_found > 0:
                      issues.append(f"{dns_not_found} not found")
                  if dns_no_resp > 0:
                      issues.append(f"{dns_no_resp} no response")
                  if avg_ms is not None:
                      avg_lbl = f"{avg_ms/1000.0:.1f}s (slow)" if is_slow else f"{avg_ms}ms"
                      issues.append(f"avg {avg_lbl}")
                  elif dns_answers > 0:
                      issues.append(f"{dns_answers} answers")
                  dns_text = "Issues: " + ", ".join(issues)

          crash_patterns = (
              "Internal process crash:",
              "VPN ended unexpectedly:",
              "VPN restarted (previous session ended unexpectedly)"
          )
          crash_entries = []
          for line in lines:
              m_ts = re.search(r"^(\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,6})?)", line)
              if not m_ts:
                  continue
              ts = m_ts.group(1)
              msg = line.split(" : ", 1)[1].strip() if " : " in line else line.strip()
              if "[Crash]" in line or any(p in msg for p in crash_patterns):
                  crash_entries.append((ts, msg))

          crash_section = ""
          if crash_entries:
              c_rows = "\n".join([f"| {md_cell(ts)} UTC | {md_cell(msg)} |" for ts, msg in crash_entries])
              crash_section = f"""

          ## Crash

          | Time (UTC) | Message |
          | --- | --- |
          {c_rows}"""

          formatted_body = f"""## Info

          | Field | Value |
          | --- | --- |
          | OS | {md_cell(info_dict['OS'])} |
          | Device | {md_cell(info_dict['Device'])} |
          | Network | {md_cell(info_dict['Network'])} |
          | VPN Status | {md_cell(vpn_status)} |
          | App Ver | {md_cell(info_dict['App Ver'])} |
          | Brook Mode Method | {md_cell(brook_method)} |

          ## Status

          | Component | Result |
          | --- | --- |
          | DNS | {md_cell(dns_text)} |
          | Network OK | {md_cell(network_ok_text)} |
          | UTUN Interface | {md_cell(utun_text)} |
          | Outbound | {md_cell(outbound_text)} |
          | Brook Mode | {md_cell(brook_status_text)} |{crash_section}

          ## Description

          {desc}{media_section}

          ---
          **Attached Log File:** [Download Log File]({download_url})
          """

          cleaned_body = "\n".join([line.strip() for line in formatted_body.splitlines()])

          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(cleaned_body)

          title_result = subprocess.run(
              ["gh", "api", f"repos/{repository}/issues/{issue_number}", "--jq", ".title"],
              capture_output=True,
              text=True,
              check=True,
          )
          current_title = title_result.stdout.strip()
          if current_title.startswith("[Report]"):
              new_title = current_title
          else:
              new_title = re.sub(r"^\[Log Analysis\]:?\s*", "[Report] ", current_title)

          gh_issue_edit("issue_formatted.md", title=new_title)
          EOF
