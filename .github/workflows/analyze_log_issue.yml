name: Format Manual Log Issue

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  analyze-and-format:
    if: |
      !contains(join(github.event.issue.labels.*.name, ','), 'log-analyzed') &&
      contains(github.event.issue.body, '### Log File Attachment')
    runs-on: ubuntu-latest
    steps:
      - name: Download Log File and Format Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTACHMENT_DOWNLOAD_TOKEN: ${{ secrets.ATTACHMENT_DOWNLOAD_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export GH_REPO="${REPOSITORY}"
          gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .body > issue_body.md

          python3 - << 'EOF'
          import html
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          issue_number = os.environ.get("ISSUE_NUMBER", "")
          repository = os.environ.get("REPOSITORY", "")
          gh_token = os.environ.get("GH_TOKEN", "")
          attachment_token = os.environ.get("ATTACHMENT_DOWNLOAD_TOKEN", "") or gh_token

          def gh_issue_edit(body_file: str, add_label: str | None = None) -> None:
              cmd = ["gh", "issue", "edit", issue_number, "--repo", repository, "--body-file", body_file]
              if add_label:
                  cmd.extend(["--add-label", add_label])
              subprocess.run(cmd, check=True)

          with open("issue_body.md", encoding="utf-8") as f:
              issue_body = f.read()

          def extract_field(label: str, text: str) -> str:
              pattern = rf"###\s+{re.escape(label)}\s*\n\n(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          ATTACHMENT_URL_PATTERNS = [
              r"https://github\.com/user-attachments/assets/[a-f0-9\-]+",
              r"https://github\.com/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^/\s\)\>]+/[^/\s\)\>]+/files/\d+/[^\s\)\>]+",
              r"https://github\.com/[^\s\)\>]+/user-attachments/files/\d+/[^\s\)\>]+",
              r"https://(?:private-)?user-images\.githubusercontent\.com/[^\s\)\>]+",
          ]

          def get_issue_body_html() -> str:
              result = subprocess.run(
                  [
                      "gh", "api", f"repos/{repository}/issues/{issue_number}",
                      "-H", "Accept: application/vnd.github.html+json",
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return json.loads(result.stdout).get("body_html", "")

          def resolve_download_urls(markdown_url: str, body_html: str) -> list[str]:
              urls: list[str] = []
              seen: set[str] = set()

              def add(url: str | None) -> None:
                  if not url:
                      return
                  normalized = html.unescape(url.strip())
                  if normalized and normalized not in seen:
                      seen.add(normalized)
                      urls.append(normalized)

              add(markdown_url)

              file_match = re.search(r"/files/(\d+)/([^?\s\"]+)", markdown_url)
              if file_match:
                  file_id = file_match.group(1)
                  filename = html.unescape(file_match.group(2))
                  for pattern in (
                      rf'href="([^"]+/files/{file_id}/{re.escape(filename)}[^"]*)"',
                      rf'href="([^"]+/files/{file_id}/[^"]+)"',
                  ):
                      match = re.search(pattern, body_html)
                      if match:
                          add(match.group(1))

              asset_match = re.search(r"/assets/([a-f0-9\-]+)", markdown_url)
              if asset_match:
                  asset_id = asset_match.group(1)
                  match = re.search(rf'href="([^"]+/assets/{asset_id}[^"]*)"', body_html)
                  if match:
                      add(match.group(1))

              if file_match:
                  file_id = file_match.group(1)
                  for match in re.finditer(r'href="([^"]+)"', body_html):
                      href = html.unescape(match.group(1))
                      if f"/files/{file_id}/" in href:
                          add(href)

              return urls

          def find_attachment_url(text: str) -> str | None:
              for pattern in ATTACHMENT_URL_PATTERNS:
                  match = re.search(pattern, text)
                  if match:
                      return match.group(0)
              link_match = re.search(r"\]\((https?://[^\)]+)\)", text)
              if link_match:
                  return link_match.group(1)
              return None

          def extract_pasted_log(text: str) -> str:
              stripped = text.strip()
              if not stripped:
                  return ""
              if re.fullmatch(r"https?://[^\s]+", stripped):
                  return ""
              if re.fullmatch(r"\[[^\]]*\]\(https?://[^\)]+\)", stripped):
                  return ""
              if "\n" not in stripped and stripped.startswith("http"):
                  return ""
              return stripped

          desc = extract_field("Description", issue_body)
          log_field = extract_field("Log File Attachment", issue_body)

          raw_log = extract_pasted_log(log_field)
          download_url = find_attachment_url(log_field) or find_attachment_url(issue_body) or ""

          if not raw_log and not download_url:
              error_body = f"{desc}\n\n> [!WARNING]\n> **No log content detected.** Please edit this issue and paste your full `.txt` or `.log` file contents into the Log File Attachment field."
              with open("issue_formatted.md", "w", encoding="utf-8") as f:
                  f.write(error_body)
              gh_issue_edit("issue_formatted.md")
              exit(0)

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new_req = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if "github.com" not in newurl.lower() and "Authorization" in new_req.headers:
                      del new_req.headers["Authorization"]
                  return new_req

          def resolve_presigned_url(file_url: str, token: str) -> tuple[str | None, str | None]:
              parsed = urllib.parse.urlparse(file_url.split("?", 1)[0])
              if parsed.hostname != "github.com" or not parsed.path.startswith("/user-attachments/"):
                  return None, "not a github user-attachments URL"

              resolve_url = urllib.parse.urlunparse(("https", "github.com", parsed.path, "", "", ""))
              req = urllib.request.Request(resolve_url)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("User-Agent", "GitHub-Actions-Log-Analyzer")
              opener = urllib.request.build_opener(NoRedirectHandler())

              try:
                  opener.open(req)
                  return None, "expected redirect, got success"
              except urllib.error.HTTPError as e:
                  if 300 <= e.code < 400:
                      location = e.headers.get("Location")
                      if location:
                          return location, None
                      return None, "redirect without location"
                  return None, f"HTTP Error {e.code}: {e.reason}"
              except Exception as e:
                  return None, str(e)

          def fetch_presigned(presigned_url: str) -> tuple[str, str | None]:
              req = urllib.request.Request(presigned_url)
              req.add_header("User-Agent", "GitHub-Actions-Log-Analyzer")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.read().decode("utf-8", errors="replace"), None
              except Exception as e:
                  return "", str(e)

          def download_log(url: str, token: str) -> tuple[str, str | None]:
              if "github.com/user-attachments/" in url:
                  presigned, err = resolve_presigned_url(url, token)
                  if presigned:
                      content, fetch_err = fetch_presigned(presigned)
                      if content:
                          return content, None
                      if fetch_err:
                          return "", fetch_err
                  if err:
                      return "", err

              req = urllib.request.Request(url)
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/octet-stream")
              req.add_header("User-Agent", "GitHub-Actions-Log-Analyzer")
              opener = urllib.request.build_opener(SafeRedirectHandler())
              try:
                  with opener.open(req) as resp:
                      return resp.read().decode("utf-8", errors="replace"), None
              except Exception as e:
                  return "", str(e)

          if not raw_log and download_url:
              body_html = get_issue_body_html()
              candidate_urls = resolve_download_urls(download_url, body_html)
              tokens_to_try = []
              if os.environ.get("ATTACHMENT_DOWNLOAD_TOKEN"):
                  tokens_to_try.append(os.environ["ATTACHMENT_DOWNLOAD_TOKEN"])
              if gh_token and gh_token not in tokens_to_try:
                  tokens_to_try.append(gh_token)

              download_error = None
              for attempt, delay in enumerate([0, 10, 20, 30]):
                  if delay:
                      time.sleep(delay)
                  for token in tokens_to_try:
                      for candidate_url in candidate_urls:
                          raw_log, download_error = download_log(candidate_url, token)
                          if raw_log:
                              download_url = candidate_url
                              break
                      if raw_log:
                          break
                  if raw_log:
                      break

          if not raw_log:
              error_body = (
                  f"{desc}\n\n"
                  f"> [!WARNING]\n"
                  f"> **Failed to read log file.**\n"
                  f"> GitHub Actions cannot download `.log` / `.txt` file attachments automatically.\n"
                  f"> Please edit this issue, open your log file, **paste the full contents** into the Log File Attachment field, and save to trigger re-analysis."
              )
              if download_url:
                  error_body += f"\n> Attachment URL: `{download_url}`\n> Error: {download_error or 'unknown error'}"
              with open("issue_formatted.md", "w", encoding="utf-8") as f:
                  f.write(error_body)
              gh_issue_edit("issue_formatted.md")
              exit(0)

          lines = raw_log.splitlines()

          def md_cell(val: str) -> str:
              return val.replace("\n", " ").replace("|", "\\|").strip()

          info_dict = {
              "OS": "unknown",
              "Device": "unknown",
              "Network": "unknown",
              "App Ver": "unknown"
          }

          for line in lines[:20]:
              if line.startswith("OS:"):
                  info_dict["OS"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("Device:"):
                  info_dict["Device"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("Network:"):
                  info_dict["Network"] = line.split(":", 1)[1].strip() or "unknown"
              elif line.startswith("App Version:"):
                  info_dict["App Ver"] = line.split(":", 1)[1].strip() or "unknown"

          traffic_indicators = (
              "proxy/tun: processing",
              "taking detour",
              "tunneling request",
              "dialing TCP",
              "proxy: Xtls",
              "Logger started",
              "core: Xray"
          )

          last_closing_idx = -1
          for idx, line in enumerate(lines):
              if "app/log: Logger closing" in line:
                  last_closing_idx = idx

          if last_closing_idx == -1:
              vpn_status = "Connected" if any("Logger started" in l or "PacketTunnelTun up" in l for l in lines) else "Unknown"
          else:
              has_traffic_after = any(
                  any(indicator in l for indicator in traffic_indicators)
                  for l in lines[last_closing_idx + 1:]
              )
              vpn_status = "Connected" if has_traffic_after else "Disconnected"

          brook_method = "Inactive / Unknown"
          if "Success, coordinates patched" in raw_log:
              brook_method = "Override (Coordinates Patched)"
          elif "Success, wloc rejected with 403" in raw_log:
              brook_method = "Reject (403 Forbidden)"
          elif re.search(r"taking detour \[block\] for \[tcp:gs-loc", raw_log):
              brook_method = "Traditional (Detour Block)"

          dns_answered_domains = set()
          for line in lines:
              if "app/dns:" in line or "proxy/dns:" in line:
                  m_ans = re.search(r"got answer:\s+([^\s]+)\.\s+Type", line)
                  if m_ans:
                      domain = m_ans.group(1).lower()
                      if "gs-loc" not in domain and "ls.apple" not in domain:
                          dns_answered_domains.add(domain)

          conn_domains = {}
          active_connections = set()

          for line in lines:
              m_sniff = re.search(r"\[(\d+)\] app/dispatcher: sniffed domain:\s+([^\s]+)", line)
              if m_sniff:
                  conn_domains[m_sniff.group(1)] = m_sniff.group(2).lower()

              if "proxy: Xtls Unpadding new block" in line or "CopyRawConn" in line:
                  m_cid = re.search(r"\[(\d+)\]", line)
                  if m_cid:
                      active_connections.add(m_cid.group(1))

          network_ok_target = None
          for cid in active_connections:
              dom = conn_domains.get(cid)
              if dom and dom in dns_answered_domains:
                  network_ok_target = dom
                  break

          if network_ok_target:
              network_ok_text = f"Yes ({network_ok_target} reachable)"
          elif dns_answered_domains and active_connections:
              network_ok_text = "Yes (traffic flow confirmed)"
          else:
              network_ok_text = "No (no external domain confirmed)"

          utun_errors = raw_log.count("falied to set interface") + raw_log.count("failed to set interface")
          utun_text = "OK" if utun_errors == 0 else f"{utun_errors} interface errors"

          detour_counts = {}
          direct_count = 0
          for line in lines:
              m = re.search(r"taking detour \[([^\]]+)\]", line)
              if m:
                  tag = m.group(1)
                  if tag in ("dns-out", "mitm-loop", "tls-repack", "block"):
                      continue
                  if tag == "direct":
                      direct_count += 1
                  else:
                      detour_counts[tag] = detour_counts.get(tag, 0) + 1

          if not detour_counts:
              outbound_text = "Direct"
          else:
              proxy_tag = max(detour_counts, key=detour_counts.get)
              proxy_count = detour_counts[proxy_tag]
              total_routing = direct_count + proxy_count
              if total_routing == 0:
                  outbound_text = f"Proxy ({proxy_tag}); no routing data in log"
              else:
                  direct_ratio = direct_count / total_routing
                  if direct_ratio >= 0.8 and total_routing >= 5:
                      outbound_text = f"Proxy ({proxy_tag}); possible misroute (mostly direct) (direct {direct_count}, proxy {proxy_count})"
                  else:
                      outbound_text = f"Proxy ({proxy_tag}); routing OK (direct {direct_count}, proxy {proxy_count})"

          spoofing_lines = [l for l in lines if "[Brook.Module.Spoofing]" in l]
          if not spoofing_lines:
              brook_status_text = "no WLOC logs"
          else:
              error_count = sum(1 for l in spoofing_lines if "[Error]" in l)
              last_success = None
              for l in spoofing_lines:
                  if "Success, coordinates patched" in l or "Success, wloc rejected with 403" in l:
                      m_ts = re.search(r"^(\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,6})?)", l)
                      if m_ts:
                          last_success = m_ts.group(1)
              parts = ["WLOC logs present"]
              if last_success:
                  parts.append(f"last success {last_success}")
              parts.append(f"{error_count} errors")
              brook_status_text = "; ".join(parts)

          dns_answers = 0
          dns_rtts = []
          dns_not_found = 0
          dns_no_resp = 0

          got_answer_pat = re.compile(r"got answer:\s+([^\s]+)\.\s+Type[^-]+->\s+\[([^\]]*)\],\s+rtt:\s*([\d.]+)ms")
          for line in lines:
              if "app/dns:" not in line and "proxy/dns:" not in line:
                  continue
              m = got_answer_pat.search(line)
              if m:
                  if m.group(2).strip():
                      dns_answers += 1
                      try:
                          dns_rtts.append(float(m.group(3)))
                      except ValueError:
                          pass
                  continue
              if "returning nil for domain" in line:
                  dns_not_found += 1
                  continue
              if "failed to retrieve response for" in line:
                  dns_no_resp += 1
                  continue

          total_dns = dns_answers + dns_not_found + dns_no_resp
          if total_dns == 0:
              dns_text = "No DNS activity in log"
          else:
              avg_ms = round(sum(dns_rtts) / len(dns_rtts)) if dns_rtts else None
              is_slow = (avg_ms is not None) and (avg_ms > 1000)
              if dns_not_found == 0 and dns_no_resp == 0 and not is_slow:
                  dns_text = f"OK ({dns_answers} answers, avg {avg_ms}ms)" if avg_ms is not None else f"OK ({dns_answers} answers)"
              else:
                  issues = []
                  if dns_not_found > 0:
                      issues.append(f"{dns_not_found} not found")
                  if dns_no_resp > 0:
                      issues.append(f"{dns_no_resp} no response")
                  if avg_ms is not None:
                      avg_lbl = f"{avg_ms/1000.0:.1f}s (slow)" if is_slow else f"{avg_ms}ms"
                      issues.append(f"avg {avg_lbl}")
                  elif dns_answers > 0:
                      issues.append(f"{dns_answers} answers")
                  dns_text = "Issues: " + ", ".join(issues)

          crash_patterns = (
              "Internal process crash:",
              "VPN ended unexpectedly:",
              "VPN restarted (previous session ended unexpectedly)"
          )
          crash_entries = []
          for line in lines:
              m_ts = re.search(r"^(\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}(?:\.\d{1,6})?)", line)
              if not m_ts:
                  continue
              ts = m_ts.group(1)
              msg = line.split(" : ", 1)[1].strip() if " : " in line else line.strip()
              if "[Crash]" in line or any(p in msg for p in crash_patterns):
                  crash_entries.append((ts, msg))

          crash_section = ""
          if crash_entries:
              c_rows = "\n".join([f"| {md_cell(ts)} UTC | {md_cell(msg)} |" for ts, msg in crash_entries])
              crash_section = f"""

          ## Crash

          | Time (UTC) | Message |
          | --- | --- |
          {c_rows}"""

          log_source_section = (
              f"---\n**Attached Log File:** [Download Log File]({download_url})"
              if download_url
              else "---\n**Log Source:** pasted log content"
          )

          formatted_body = f"""## Info

          | Field | Value |
          | --- | --- |
          | OS | {md_cell(info_dict['OS'])} |
          | Device | {md_cell(info_dict['Device'])} |
          | Network | {md_cell(info_dict['Network'])} |
          | VPN Status | {md_cell(vpn_status)} |
          | App Ver | {md_cell(info_dict['App Ver'])} |
          | Brook Mode Method | {md_cell(brook_method)} |

          ## Status

          | Component | Result |
          | --- | --- |
          | DNS | {md_cell(dns_text)} |
          | Network OK | {md_cell(network_ok_text)} |
          | UTUN Interface | {md_cell(utun_text)} |
          | Outbound | {md_cell(outbound_text)} |
          | Brook Mode | {md_cell(brook_status_text)} |{crash_section}

          ## Description

          {desc}

          {log_source_section}
          """

          cleaned_body = "\n".join([line.strip() for line in formatted_body.splitlines()])

          with open("issue_formatted.md", "w", encoding="utf-8") as f:
              f.write(cleaned_body)

          gh_issue_edit("issue_formatted.md", add_label="log-analyzed")
          EOF
