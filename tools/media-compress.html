<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Compressor</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { font-size: 1.4rem; }
    .drop { border: 2px dashed #d0d7de; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; }
    .drop.drag { border-color: #0969da; background: #f6f8fa; }
    #status { margin-top: 1rem; white-space: pre-wrap; font-size: 0.9rem; }
    .hint { color: #656d76; font-size: 0.85rem; }
    progress { width: 100%; margin-top: 0.5rem; }
    progress.indeterminate::-webkit-progress-bar { background: #eaeef2; }
    progress.indeterminate::-webkit-progress-value { background: #0969da; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <h1>Media Compressor</h1>
  <p>Compress images or videos to <strong>10 MB</strong> or less for GitHub issue uploads. Files are processed locally in your browser.</p>
  <div class="drop" id="drop">
    <p>Drag and drop an image or video, or click to choose</p>
    <input type="file" id="file" accept="image/*,video/*,audio/*,.mp4,.mov,.webm,.m4a,.mp3" hidden>
  </div>
  <p class="hint">Images: fully offline. Video/audio: requires one-time download of ffmpeg.wasm (~31 MB) with progress shown below.</p>
  <progress id="progress" value="0" max="100" hidden></progress>
  <div id="status"></div>
  <script type="module">
    const MAX = 10 * 1024 * 1024;
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('drag');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function setStatus(msg) { status.textContent = msg; }
    function formatSize(n) {
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(2)} MB`;
    }
    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function compressImage(file) {
      const img = await createImageBitmap(file);
      let w = img.width;
      let h = img.height;
      let quality = 0.92;
      let scale = 1;
      let blob = null;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      for (let attempt = 0; attempt < 20; attempt++) {
        const tw = Math.max(1, Math.round(w * scale));
        const th = Math.max(1, Math.round(h * scale));
        canvas.width = tw;
        canvas.height = th;
        ctx.drawImage(img, 0, 0, tw, th);
        const type = file.type === 'image/png' ? 'image/jpeg' : (file.type || 'image/jpeg');
        blob = await new Promise((r) => canvas.toBlob(r, type, quality));
        if (!blob) throw new Error('Failed to encode image');
        if (blob.size <= MAX) break;
        if (quality > 0.35) quality -= 0.08;
        else scale *= 0.85;
      }
      const ext = blob.type.includes('png') ? 'png' : 'jpg';
      const outName = file.name.replace(/\.[^.]+$/, '') + `.compressed.${ext}`;
      downloadBlob(blob, outName);
      setStatus(`Done: ${formatSize(file.size)} → ${formatSize(blob.size)}\nSaved as ${outName}`);
    }

    function downloadToBlobURL(url, mimeType, label) {
      return fetch(url).then(async (resp) => {
        if (!resp.ok) throw new Error(`Failed to download ${label} (${resp.status})`);
        const total = Number(resp.headers.get('content-length')) || 0;
        if (!resp.body || total <= 0) {
          const buf = await resp.arrayBuffer();
          return URL.createObjectURL(new Blob([buf], { type: mimeType }));
        }
        const reader = resp.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          progress.hidden = false;
          progress.value = total > 0 ? Math.round((received / total) * 100) : 0;
          setStatus(`Downloading ${label}… ${formatSize(received)}${total > 0 ? ` / ${formatSize(total)}` : ''}`);
        }
        const merged = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }
        return URL.createObjectURL(new Blob([merged], { type: mimeType }));
      });
    }

    async function readInputBytes(file) {
      // Read immediately — waiting until after ffmpeg load can lock/disturb the body on WebKit.
      const blob = file.slice(0, file.size, file.type || 'application/octet-stream');
      return new Uint8Array(await blob.arrayBuffer());
    }

    let ffmpegInstance = null;
    let busy = false;

    async function loadFfmpeg() {
      if (ffmpegInstance?.loaded) return ffmpegInstance;

      setStatus('Loading ffmpeg module…');
      progress.hidden = false;
      progress.value = 0;

      const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm');

      const ffmpeg = new FFmpeg();
      ffmpeg.on('log', ({ message }) => {
        console.log('[ffmpeg]', message);
        if (/error|fail|warn/i.test(message)) {
          setStatus(`Initializing ffmpeg…\n${message}`);
        }
      });
      ffmpeg.on('progress', ({ progress: p }) => {
        progress.value = Math.round((p || 0) * 100);
      });

      const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';

      setStatus('Downloading ffmpeg-core.js…');
      const coreURL = await downloadToBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript', 'ffmpeg-core.js');
      setStatus('Downloading ffmpeg-core.wasm…');
      const wasmURL = await downloadToBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm', 'ffmpeg-core.wasm');

      setStatus('Initializing ffmpeg… (compiling wasm, may take up to a minute)');
      progress.removeAttribute('value');
      progress.classList.add('indeterminate');
      await ffmpeg.load({ coreURL, wasmURL });
      progress.classList.remove('indeterminate');
      progress.value = 0;

      ffmpegInstance = ffmpeg;
      return ffmpegInstance;
    }

    async function compressWithFfmpeg(file, inputBytes) {
      const ffmpeg = await loadFfmpeg();
      const isAudio = file.type.startsWith('audio/') || /\.(m4a|mp3|aac|wav)$/i.test(file.name);
      const inName = 'input' + (file.name.match(/\.[^.]+$/)?.[0] || (isAudio ? '.m4a' : '.mp4'));
      const outName = isAudio ? 'output.m4a' : 'output.mp4';

      await ffmpeg.writeFile(inName, inputBytes);

      let crf = 28;
      let scale = null;
      let outBlob = null;

      for (let i = 0; i < 8; i++) {
        setStatus(`Compressing (pass ${i + 1})…`);
        progress.value = 0;

        const args = ['-y', '-i', inName];
        if (isAudio) {
          args.push('-c:a', 'aac', '-b:a', '128k');
          if (i > 2) args.push('-b:a', '96k');
          if (i > 4) args.push('-b:a', '64k');
        } else {
          args.push('-c:v', 'libx264', '-crf', String(crf), '-preset', 'fast', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', '-c:a', 'aac', '-b:a', '128k');
          if (scale) args.push('-vf', scale);
        }
        args.push(outName);

        await ffmpeg.exec(args);
        const data = await ffmpeg.readFile(outName);
        outBlob = new Blob([data], { type: isAudio ? 'audio/mp4' : 'video/mp4' });
        try { await ffmpeg.deleteFile(outName); } catch { /* ignore */ }
        if (outBlob.size <= MAX) break;
        if (isAudio) continue;
        crf = Math.min(crf + 4, 40);
        scale = scale ? 'scale=iw*0.75:-2' : 'scale=iw*0.85:-2';
      }

      progress.hidden = true;
      if (!outBlob || outBlob.size > MAX) {
        setStatus('Could not compress below 10 MB. Try a shorter clip or lower resolution source.');
        return;
      }
      const ext = isAudio ? 'm4a' : 'mp4';
      const finalName = file.name.replace(/\.[^.]+$/, '') + `.compressed.${ext}`;
      downloadBlob(outBlob, finalName);
      setStatus(`Done: ${formatSize(file.size)} → ${formatSize(outBlob.size)}\nSaved as ${finalName}`);
    }

    async function handleFile(file) {
      if (busy) return;
      busy = true;
      try {
        setStatus(`Processing ${file.name} (${formatSize(file.size)})…`);
        if (file.size <= MAX) {
          setStatus(`File is already ≤ 10 MB (${formatSize(file.size)}). No compression needed.`);
          return;
        }
        if (file.type.startsWith('image/')) {
          await compressImage(file);
        } else if (file.type.startsWith('video/') || file.type.startsWith('audio/') || /\.(mp4|mov|webm|m4a|mp3)$/i.test(file.name)) {
          setStatus(`Reading ${file.name}…`);
          const inputBytes = await readInputBytes(file);
          await compressWithFfmpeg(file, inputBytes);
        } else {
          setStatus('Unsupported file type. Use an image or video file.');
        }
      } catch (err) {
        progress.hidden = true;
        setStatus(`Error: ${err.message}\nTry another file or compress manually.`);
      } finally {
        busy = false;
        fileInput.value = '';
      }
    }
  </script>
</body>
</html>
